<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malaïka Freight — Studio opérationnel</title><style>
:root{--navy:#11263b;--gold:#c49b58;--ink:#1b2d3d;--muted:#708193;--line:#e4eaf0;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:67px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 27px}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:.7px}.brand span{color:#e6c88e}header small{color:#c6d1dc}.shell{display:flex;min-height:calc(100vh - 67px)}nav{width:238px;background:#fff;border-right:1px solid var(--line);padding:22px 12px;flex-shrink:0}nav .group{font-size:10px;letter-spacing:1.8px;color:#97a4b0;font-weight:700;margin:22px 12px 7px}nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 13px;color:#4b6071;border-radius:8px;margin:1px 0}nav button.active,nav button:hover{background:#edf2f6;color:#122e49;font-weight:700}main{padding:30px;flex:1;min-width:0;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}h1{font-family:Georgia,serif;font-weight:400;font-size:30px;margin:0}h2{font-size:17px;margin:0 0 15px}p.sub{margin:4px 0 0;color:var(--muted)}.btn{border:1px solid #cbd6df;background:white;color:#173149;padding:10px 15px;border-radius:8px;font-weight:600}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.btn.gold{background:var(--gold);color:#142335;border-color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar select,.toolbar input{padding:10px 12px;border:1px solid #d6dfe6;border-radius:8px;background:white;max-width:220px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px}.stat{padding:19px}.stat .label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:5px;letter-spacing:-.5px}.panel{padding:20px;margin-bottom:18px;overflow:auto}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:#81909e;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #eef1f4}td:last-child{text-align:right}tr:last-child td{border-bottom:0}.pill{font-size:11px;padding:5px 9px;border-radius:20px;background:#eef3f7;color:#36536b;white-space:nowrap}.pill.ok{background:#e5f4e9;color:#286844}.pill.warn{background:#fff1d9;color:#946017}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field label{display:block;color:#526777;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d5dfe7;padding:11px;border-radius:8px;background:#fff}.field.wide{grid-column:1/-1}.field textarea{min-height:80px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.empty{padding:30px;text-align:center;color:#728391}.hint{background:#f7f2e8;border-left:3px solid var(--gold);padding:13px 15px;border-radius:5px;color:#725c36;margin-bottom:17px}.future{border:1px dashed #c4cfd8;padding:23px;border-radius:10px;background:#fafbfc}.footer{margin:30px 0;color:#91a0ac;font-size:12px}.printable{display:none}.label-box{width:100mm;min-height:140mm;border:2px solid #15283b;padding:13mm;background:white;color:#111}.invoice-box{max-width:750px;background:white;color:#15283b;padding:25px}.qr{width:125px;height:125px;display:flex;align-items:center;justify-content:center;border:1px solid #eee}.qr img{width:100%;height:100%}.small{font-size:12px}.split{display:flex;justify-content:space-between;gap:18px}.separator{border-top:1px solid #d6dfe6;margin:18px 0}.hidden{display:none!important}@media(max-width:960px){nav{width:190px}main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:650px){header{padding:0 13px}nav{width:65px;padding:12px 5px}nav button{font-size:0;padding:11px 8px}nav button:before{content:'▸';font-size:16px}nav .group{font-size:0}main{padding:12px}.cards{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.formgrid{grid-template-columns:1fr}.brand{font-size:17px}}@media print{header,nav,.top,.footer,.noprint,.hint{display:none!important}body,main{background:white;padding:0!important}.shell{display:block;min-height:0}.panel{border:0;padding:0}.printable{display:block!important}#app{display:none!important}@page{margin:12mm}}
</style></head><body><header><div class="brand">✦ MALAÏKA <span>FREIGHT</span></div><small>OPERATIONS STUDIO &nbsp; · &nbsp; DÉMONSTRATION</small></header><div class="shell"><nav id="nav"></nav><main><div id="app"></div><div class="footer">Malaïka Freight · Maquette de référence · Données fictives conservées localement dans ce navigateur · Aucun serveur connecté</div></main></div><div id="printArea" class="printable"></div>
<script>
const KEY='malaika-reference-v1';const initial=[{id:'MF-MAD-000125',client:'Amina Test',phone:'+34 600 000 000',recipient:'Daniel Démo',recipientPhone:'+243 800 000 000',origin:'Madrid',destination:'Kinshasa',weight:12,estimated:12,carton:'Carton 20 kg',rate:16,currency:'EUR',paid:100,status:'Reçu à Madrid',contents:'Vêtements',date:'2026-11-02',pieces:1},{id:'MF-MAD-000126',client:'Patrick Exemple',phone:'+34 600 000 001',recipient:'Grâce Exemple',recipientPhone:'+243 800 000 001',origin:'Madrid',destination:'Kinshasa',weight:20,estimated:20,carton:'Au kilo',rate:16,currency:'EUR',paid:320,status:'En transit',contents:'Effets personnels',date:'2026-11-02',pieces:2},{id:'MF-FIH-000127',client:'Client Démo',phone:'+243 800 000 002',recipient:'Destinataire Démo',recipientPhone:'+243 800 000 003',origin:'Kinshasa',destination:'Madrid',weight:5,estimated:5,carton:'Carton 5 kg',rate:0,currency:'USD',paid:0,status:'Projet futur',contents:'Documents non sensibles (démo)',date:'2026-11-02',pieces:1}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.parcels))state={parcels:initial,events:[],tab:'dashboard',agency:'Toutes les agences'};let tab=state.tab||'dashboard';let agency=state.agency||'Toutes les agences';let q='';const statuses=['Pré-réservé','Reçu à Madrid','Reçu à Kinshasa','En préparation','En transit','Arrivé à destination','En dédouanement','Disponible pour retrait','Livré','Incident','Projet futur'];const groups=[['PILOTAGE',[['dashboard','Vue d’ensemble'],['parcels','Colis & réception'],['shipments','Expéditions'],['clients','Clients']]],['GESTION',[['billing','Facturation'],['finance','Comptabilité'],['inventory','Stocks & cartons'],['staff','Personnel & pointage']]],['SERVICE',[['tracking','Suivi client'],['delivery','Livraisons'],['feedback','Avis clients']]],['ÉVOLUTION',[['documents','Documents · futur'],['transfer','Transfert · futur'],['settings','Paramètres']]]];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(v,c)=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(v)+' '+(c==='EUR'?'€':c==='USD'?'$':c);const save=()=>{state.tab=tab;state.agency=agency;localStorage.setItem(KEY,JSON.stringify(state))};const filtered=()=>state.parcels.filter(p=>(agency==='Toutes les agences'||p.origin===agency)&&(!q||[p.id,p.client,p.recipient,p.status].join(' ').toLowerCase().includes(q.toLowerCase())));const byid=id=>state.parcels.find(p=>p.id===id);const panel=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;function renderNav(){document.getElementById('nav').innerHTML=groups.map(g=>`<div class="group">${g[0]}</div>`+g[1].map(i=>`<button class="${tab===i[0]?'active':''}" onclick="go('${i[0]}')">${esc(i[1])}</button>`).join('')).join('')};function go(t){tab=t;q='';save();render()};function filterAgency(v){agency=v;save();render()};function top(title,subtitle,buttons=''){return `<div class="top"><div><h1>${title}</h1><p class="sub">${subtitle}</p></div><div class="toolbar"><select aria-label="Agence" onchange="filterAgency(this.value)">${['Toutes les agences','Madrid','Kinshasa'].map(a=>`<option ${agency===a?'selected':''}>${a}</option>`).join('')}</select>${buttons}</div></div>`};function pill(s){return `<span class="pill ${s==='Livré'?'ok':s==='Incident'?'warn':''}">${esc(s)}</span>`};function row(p){return `<tr><td><b>${esc(p.id)}</b><br><span class="muted small">${esc(p.date)}</span></td><td>${esc(p.client)}<br><span class="muted small">→ ${esc(p.recipient)}</span></td><td>${esc(p.origin)} → ${esc(p.destination)}</td><td>${p.weight} kg<br><span class="muted small">${esc(p.carton)}</span></td><td>${pill(p.status)}</td><td><button class="btn" onclick="details('${esc(p.id)}')">Ouvrir</button></td></tr>`};function table(ps){return ps.length?`<table><thead><tr><th>Référence</th><th>Expéditeur / destinataire</th><th>Trajet</th><th>Poids</th><th>Statut</th><th>Action</th></tr></thead><tbody>${ps.map(row).join('')}</tbody></table>`:'<div class="empty">Aucun colis correspondant.</div>'};function dashboard(){let ps=filtered(),wt=ps.reduce((a,p)=>a+Number(p.weight),0),transit=ps.filter(p=>p.status==='En transit').length,del=ps.filter(p=>p.status==='Livré').length;return top('Vue d’ensemble','Supervision des opérations · Madrid et Kinshasa',`<button class="btn primary" onclick="go('new')">+ Enregistrer un colis</button>`)+`<div class="cards">${[['Colis enregistrés',ps.length],['Poids total',wt+' kg'],['En transit',transit],['Livrés',del]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><strong>${x[1]}</strong></div>`).join('')}</div>`+`<div class="two">${panel('Activité récente',table(ps.slice().reverse().slice(0,6)))}${panel('Points de contrôle',`<div class="hint">Les données affichées sont des exemples. Aucun suivi réel ni synchronisation entre agences.</div><p><b>${ps.filter(p=>p.status==='Incident').length}</b> incident(s) à traiter</p><p><b>${ps.filter(p=>p.status==='Disponible pour retrait').length}</b> colis disponible(s) pour retrait</p><p><b>${ps.filter(p=>p.status==='Pré-réservé').length}</b> pré-réservation(s)</p><div class="actions"><button class="btn" onclick="go('finance')">Consulter les finances</button><button class="btn" onclick="go('shipments')">Voir les expéditions</button></div>`)}</div>`};function parcels(){return top('Colis & réception','Enregistrement, traçabilité et documents',`<button class="btn primary" onclick="go('new')">+ Nouveau colis</button>`)+panel('Registre des colis',`<div class="toolbar noprint" style="margin-bottom:15px"><input placeholder="Rechercher une référence ou un client" value="${esc(q)}" oninput="q=this.value;document.getElementById('parcelTable').innerHTML=table(filtered())"></div><div id="parcelTable">${table(filtered())}</div>`)};function newParcel(){return top('Enregistrer un colis','Une saisie pour le suivi, la facture et l’étiquette')+panel('Fiche de réception',`<div class="hint">Mode démonstration : ne saisissez aucune donnée personnelle réelle. Les données restent sur cet appareil.</div><form onsubmit="createParcel(event)"><div class="formgrid">${field('client','Nom de l’expéditeur','text',true)}${field('phone','Téléphone de l’expéditeur','tel',true)}${field('recipient','Nom du destinataire','text',true)}${field('recipientPhone','Téléphone du destinataire','tel',true)}<div class="field"><label>Agence de départ</label><select name="origin" id="origin" onchange="document.getElementById('destination').value=this.value==='Madrid'?'Kinshasa':'Madrid';document.getElementById('currency').value=this.value==='Madrid'?'EUR':'USD'"><option>Madrid</option><option>Kinshasa</option></select></div><div class="field"><label>Destination</label><select name="destination" id="destination"><option>Kinshasa</option><option>Madrid</option></select></div>${field('estimated','Poids estimé (kg)','number',true,'min="0.1" step="0.1"')}${field('weight','Poids réel (kg)','number',true,'min="0.1" step="0.1"')}<div class="field"><label>Formule</label><select name="carton"><option>Au kilo</option><option>Carton 5 kg</option><option>Carton 10 kg</option><option>Carton 20 kg</option></select></div>${field('pieces','Nombre de colis / pièces','number',true,'min="1" step="1" value="1"')}${field('rate','Prix par kg (à confirmer)','number',true,'min="0" step="0.01" value="16"')}<div class="field"><label>Devise</label><select name="currency" id="currency"><option value="EUR">EUR — Madrid</option><option value="USD">USD — Kinshasa</option></select></div>${field('paid','Montant déjà encaissé','number',false,'min="0" step="0.01" value="0"')}<div class="field wide"><label>Description générale du contenu</label><textarea name="contents" placeholder="Ex. vêtements, chaussures, effets personnels"></textarea></div></div><div class="actions"><button type="submit" class="btn primary">Enregistrer et créer les documents</button><button type="button" class="btn" onclick="go('parcels')">Annuler</button></div></form>`)};function field(name,label,type,required=false,extra=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" ${required?'required':''} ${extra}></div>`};function createParcel(e){e.preventDefault();let f=new FormData(e.target),obj=Object.fromEntries(f.entries());for(let k of ['weight','estimated','rate','paid','pieces'])obj[k]=Number(obj[k]||0);if(obj.weight<=0||obj.pieces<1)return alert('Vérifiez le poids et le nombre de pièces.');let n=100128+state.parcels.length;obj.id=`MF-${obj.origin==='Madrid'?'MAD':'FIH'}-${n}`;obj.status=obj.origin==='Madrid'?'Reçu à Madrid':'Reçu à Kinshasa';obj.date=new Date().toISOString().slice(0,10);state.parcels.push(obj);state.events.unshift({id:obj.id,action:'Réception',date:new Date().toLocaleString('fr-FR')});save();details(obj.id)};function details(id){let p=byid(id);if(!p)return;tab='detail';state.selected=id;save();render()};function detail(){let p=byid(state.selected);if(!p)return go('parcels');let total=p.weight*p.rate;return top('Fiche '+p.id,'Réception · documents · suivi',`<button class="btn" onclick="go('parcels')">← Tous les colis</button>`)+`<div class="two">${panel('Informations du colis',`<p><b>Expéditeur :</b> ${esc(p.client)} · ${esc(p.phone)}</p><p><b>Destinataire :</b> ${esc(p.recipient)} · ${esc(p.recipientPhone)}</p><p><b>Itinéraire :</b> ${esc(p.origin)} → ${esc(p.destination)}</p><p><b>Contenu :</b> ${esc(p.contents||'Non renseigné')}</p><p><b>Poids estimé / réel :</b> ${p.estimated} / ${p.weight} kg</p><p><b>Conditionnement :</b> ${esc(p.carton)} · ${p.pieces} pièce(s)</p><p><b>Montant :</b> ${money(total,p.currency)} · <b>Encaissé :</b> ${money(p.paid,p.currency)}</p><p><b>Solde :</b> ${money(total-p.paid,p.currency)}</p><div class="actions"><button class="btn primary" onclick="printDoc('invoice','${esc(p.id)}')">Imprimer facture</button><button class="btn gold" onclick="printDoc('label','${esc(p.id)}')">Étiquette + QR</button></div>`)}${panel('Mise à jour du suivi',`<div class="field"><label>Statut actuel</label><select id="statusSelect">${statuses.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" onclick="updateStatus('${esc(p.id)}')">Enregistrer le statut</button></div><div class="separator"></div><p class="muted small">Chaque modification est consignée dans le journal local de démonstration. En production, l’historique sera horodaté côté serveur avec identité de l’agent.</p>`)}</div>`};function updateStatus(id){let p=byid(id);p.status=document.getElementById('statusSelect').value;state.events.unshift({id,action:'Statut : '+p.status,date:new Date().toLocaleString('fr-FR')});save();render()};function qrMarkup(id){return `<div class="qr"><img alt="QR de suivi" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent('https://malaikafreight.example/suivi/'+id)}" onerror="this.style.display='none';this.parentElement.innerHTML='<small>QR indisponible hors ligne</small>'"></div>`};function printDoc(kind,id){let p=byid(id);let total=p.weight*p.rate, balance=total-p.paid;let doc=kind==='invoice'?`<div class="invoice-box"><div class="split"><div><div class="brand" style="color:#14263b">✦ MALAÏKA <span>FREIGHT</span></div><p class="small">Malaika Saida Holding SARLU<br>contact.malaikafreight@gmail.com<br>+243 978 967 730</p></div><div style="text-align:right"><h1>FACTURE</h1><p>${esc(p.id)}<br>${esc(p.date)}</p></div></div><div class="separator"></div><div class="split"><div><b>Expéditeur</b><p>${esc(p.client)}<br>${esc(p.phone)}</p></div><div><b>Destinataire</b><p>${esc(p.recipient)}<br>${esc(p.recipientPhone)}</p></div></div><p><b>Trajet :</b> ${esc(p.origin)} → ${esc(p.destination)}</p><table><thead><tr><th>Prestation</th><th>Quantité</th><th>Prix unitaire</th><th>Montant</th></tr></thead><tbody><tr><td>Transport de colis — ${esc(p.carton)}<br><small>${esc(p.contents)}</small></td><td>${p.weight} kg</td><td>${money(p.rate,p.currency)}/kg</td><td>${money(total,p.currency)}</td></tr></tbody></table><div style="text-align:right;margin-top:25px"><p>Total : <b>${money(total,p.currency)}</b></p><p>Déjà payé : ${money(p.paid,p.currency)}</p><h2>Reste à payer : ${money(balance,p.currency)}</h2></div><div class="separator"></div><p class="small">Document de démonstration · Tarifs et mentions légales à valider avant usage commercial.</p></div>`:`<div class="label-box"><div class="brand" style="color:#14263b">✦ MALAÏKA <span>FREIGHT</span></div><div class="separator"></div><h2 style="font-size:22px">${esc(p.origin).toUpperCase()} → ${esc(p.destination).toUpperCase()}</h2><h2>${esc(p.id)}</h2><div class="split"><div><b>DESTINATAIRE</b><p>${esc(p.recipient)}<br>${esc(p.recipientPhone)}</p><b>EXPÉDITEUR</b><p>${esc(p.client)}</p></div>${qrMarkup(p.id)}</div><div class="separator"></div><p><b>POIDS :</b> ${p.weight} kg &nbsp; <b>PIÈCES :</b> ${p.pieces}</p><p><b>FORMULE :</b> ${esc(p.carton)}</p><p><b>CONTENU :</b> ${esc(p.contents||'Non renseigné')}</p><div class="separator"></div><p class="small">SCAN : identification du colis · Le QR contient uniquement une référence de suivi. Ne pas exposer les données personnelles publiquement.</p><div style="font-family:monospace;letter-spacing:3px;font-size:18px">*${esc(p.id)}*</div></div>`;document.getElementById('printArea').innerHTML=doc;window.print()};function clients(){let ps=filtered();let uniq=[...new Map(ps.map(p=>[p.client,p])).values()];return top('Clients','Répertoire des expéditeurs · démonstration')+panel('Fiches clients',`<table><thead><tr><th>Client</th><th>Téléphone</th><th>Agence</th><th>Colis</th></tr></thead><tbody>${uniq.map(p=>`<tr><td>${esc(p.client)}</td><td>${esc(p.phone)}</td><td>${esc(p.origin)}</td><td>${ps.filter(x=>x.client===p.client).length}</td></tr>`).join('')}</tbody></table>`)};function shipments(){let ps=filtered();return top('Expéditions','Préparation des départs et consolidation')+panel('Registre des expéditions',`<div class="hint">La création de manifestes, l’affectation des colis à un vol et les coûts réels nécessitent la base de données de production.</div>${table(ps)}`)};function billing(){return top('Facturation','Documents calculés à partir des fiches colis')+panel('Factures de démonstration',`<p class="muted">Ouvrez un colis pour générer sa facture PDF via l’impression du navigateur.</p>${table(filtered())}`)};function finance(){let ps=filtered(),byCur=['EUR','USD'].map(c=>{let x=ps.filter(p=>p.currency===c);return {c,billed:x.reduce((a,p)=>a+p.weight*p.rate,0),paid:x.reduce((a,p)=>a+p.paid,0)}});return top('Comptabilité','Lecture des encaissements · devises séparées')+`<div class="cards">${byCur.map(x=>`<div class="stat"><div class="label">Facturé ${x.c}</div><strong>${money(x.billed,x.c)}</strong></div><div class="stat"><div class="label">Encaissé ${x.c}</div><strong>${money(x.paid,x.c)}</strong></div>`).join('')}</div>`+panel('Principes de gestion',`<div class="hint">Ceci n’est pas une comptabilité OHADA. Grand livre, balance, rapprochements, dépenses et états financiers doivent être développés et validés séparément.</div><p>Les montants EUR et USD ne sont jamais additionnés sans taux de conversion explicite.</p>`)};function inventory(){return top('Stocks & cartons','Catalogue de référence — tarifs à confirmer')+panel('Conditionnements',`<table><thead><tr><th>Offre</th><th>Utilisation</th><th>Statut</th></tr></thead><tbody>${['Au kilo','Carton 5 kg','Carton 10 kg','Carton 20 kg'].map(x=>`<tr><td>${x}</td><td>Madrid → Kinshasa</td><td>${pill('Tarif à valider')}</td></tr>`).join('')}</tbody></table><p class="muted small">Les stocks physiques, seuils d’alerte et mouvements seront intégrés en production.</p>`)};function tracking(){return top('Suivi client','Recherche interne par référence')+panel('Retrouver un colis',`<div class="toolbar"><input id="trackInput" placeholder="MF-MAD-000125"><button class="btn primary" onclick="track()">Rechercher</button></div><div id="trackResult" style="margin-top:20px"></div><p class="muted small">Le portail public exigera un jeton ou code de vérification, pas une simple référence devinable.</p>`)};function track(){let id=document.getElementById('trackInput').value.trim().toUpperCase(),p=byid(id);document.getElementById('trackResult').innerHTML=p?`<b>${esc(p.id)}</b><p>${esc(p.origin)} → ${esc(p.destination)}</p><p>${pill(p.status)}</p>`:'Aucun colis correspondant.'};function placeholder(name,description){return top(name,'Module prévu dans l’architecture cible')+panel('Spécification fonctionnelle',`<div class="future"><h2>${name}</h2><p>${description}</p><p class="muted">Ce module n’est pas opérationnel dans la maquette. Il sera implémenté par l’équipe de développement suivant le cahier des charges.</p></div>`)};function settings(){return top('Paramètres','Architecture multi-agences et multi-services')+panel('Configuration prévue',`<p><b>Agences :</b> Madrid · Kinshasa</p><p><b>Corridors :</b> Madrid ↔ Kinshasa</p><p><b>Services :</b> Fret · Documents (futur) · Transfert d’argent (futur, sous autorisations)</p><p><b>Devises :</b> EUR · USD · CDF (extension future)</p><div class="hint">La version réelle devra inclure authentification, rôles, permissions, sauvegardes, journal d’audit et politiques de confidentialité.</div><button class="btn" onclick="if(confirm('Effacer uniquement les données de démonstration de ce navigateur ?')){localStorage.removeItem(KEY);location.reload()}">Réinitialiser la démonstration</button>`)};function render(){renderNav();let v=({dashboard,parcels,new:newParcel,detail,clients,shipments,billing,finance,inventory,tracking,settings})[tab];document.getElementById('app').innerHTML=v?v():tab==='staff'?placeholder('Personnel & pointage','Comptes collaborateurs, présence vérifiée par QR code, autorisations par agence et journal des opérations.'):tab==='delivery'?placeholder('Livraisons','Ordres de livraison, affectation aux agents, preuve de remise et incidents.'):tab==='feedback'?placeholder('Avis clients','Collecte d’avis après livraison, modération et statistiques de satisfaction.'):tab==='documents'?placeholder('Malaïka Documents','Service futur d’envoi de documents physiques avec suivi, confidentialité et preuve de remise.'):tab==='transfer'?placeholder('Malaïka Transfert','Module futur Madrid ↔ Kinshasa. Aucun transfert réel sans autorisations et partenariat appropriés.'):dashboard()};render();
</script></body></html>
