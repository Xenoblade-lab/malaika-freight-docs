<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecture — Malaïka Freight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <style>
    :root {
      --navy: #11263b;
      --navy-deep: #0a1621;
      --navy-mid: #1a3348;
      --gold: #c49b58;
      --gold-soft: #e6c88e;
      --ink: #1e2f3d;
      --muted: #6d7f90;
      --white: #fffdf9;
      --paper: #f7f4ee;
      --line: rgba(17, 38, 59, 0.1);
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-ui: "Outfit", system-ui, sans-serif;
      --prose: 46rem;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-ui);
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(196,155,88,.14), transparent 55%),
        linear-gradient(180deg, #f7f4ee, #eef2f6 55%, #f7f4ee);
    }

    a { color: inherit; }

    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 22px;
      background: rgba(10, 22, 33, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(196,155,88,.22);
      color: var(--white);
    }
    .brand {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: .03em;
    }
    .brand em { color: var(--gold-soft); font-style: italic; font-weight: 500; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,253,249,.25);
      color: var(--white);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 600;
      background: transparent;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--gold-soft); color: var(--gold-soft); }
    .btn.gold {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy-deep);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 0;
      width: min(1280px, 100%);
      margin: 0 auto;
      min-height: calc(100vh - 58px);
    }

    .toc {
      position: sticky;
      top: 58px;
      align-self: start;
      height: calc(100vh - 58px);
      overflow: auto;
      padding: 24px 16px 40px;
      border-right: 1px solid var(--line);
      background: rgba(255,253,249,.55);
    }
    .toc h2 {
      margin: 0 0 14px;
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .toc a {
      display: block;
      padding: 7px 10px;
      margin-bottom: 2px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--navy);
      font-size: .88rem;
      line-height: 1.35;
      font-weight: 500;
    }
    .toc a:hover,
    .toc a.active {
      background: rgba(196,155,88,.14);
      color: #7a5a22;
    }
    .toc a.l2 { padding-left: 18px; font-weight: 400; color: var(--muted); font-size: .84rem; }
    .toc a.l3 { padding-left: 28px; font-weight: 400; color: var(--muted); font-size: .8rem; }

    .doc-select {
      margin-bottom: 18px;
    }
    .doc-select label {
      display: block;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .doc-select select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--white);
      font: inherit;
      color: var(--navy);
    }

    .article-wrap {
      padding: 36px 28px 80px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 22px;
    }
    .pill {
      display: inline-flex;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(196,155,88,.14);
      color: #7a5a22;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .meta .file {
      color: var(--muted);
      font-size: .88rem;
    }

    .prose {
      width: min(100%, var(--prose));
      margin: 0 auto 0 0;
      background: #fffdf9;
      color: #152533;
      border: 1px solid rgba(17,38,59,.1);
      border-radius: 22px;
      padding: clamp(22px, 4vw, 42px);
      box-shadow: 0 18px 50px rgba(17,38,59,.06);
      animation: rise .45s ease both;
    }

    .prose > :first-child { margin-top: 0; }

    .prose h1 {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 4vw, 3rem);
      line-height: 1.08;
      color: #0a1621;
      margin: 0 0 14px;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .prose h2 {
      font-family: var(--font-display);
      font-size: 1.7rem;
      color: #11263b;
      margin: 2.2rem 0 .7rem;
      padding-top: .4rem;
      border-top: 1px solid var(--line);
      font-weight: 600;
    }
    .prose h2:first-of-type { border-top: 0; padding-top: 0; }
    .prose h3 {
      font-size: 1.15rem;
      color: #1a3348;
      margin: 1.5rem 0 .55rem;
      font-weight: 700;
    }
    .prose h4 {
      font-size: 1rem;
      margin: 1.2rem 0 .4rem;
      color: #11263b;
    }
    .prose p, .prose li {
      line-height: 1.7;
      font-size: 1.05rem;
      color: #1b2d3d;
    }
    .prose p { margin: 0 0 1rem; }
    .prose ul, .prose ol { padding-left: 1.2rem; margin: 0 0 1rem; }
    .prose li { margin: .35rem 0; }
    .prose strong { color: var(--navy); font-weight: 700; }
    .prose a {
      color: #8a6428;
      text-decoration: underline;
      text-decoration-color: rgba(196,155,88,.55);
      text-underline-offset: 3px;
    }
    .prose blockquote {
      margin: 1.2rem 0;
      padding: 12px 16px;
      border-left: 3px solid var(--gold);
      background: rgba(196,155,88,.08);
      border-radius: 0 12px 12px 0;
      color: #5d4a28;
    }
    .prose blockquote p:last-child { margin-bottom: 0; }
    .prose hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 2rem 0;
    }
    .prose code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .88em;
      background: #eef3f7;
      padding: .15em .4em;
      border-radius: 6px;
      color: #1f3a4f;
    }
    .prose pre {
      overflow: auto;
      padding: 16px;
      border-radius: 14px;
      background: #122433;
      color: #e8eef3;
      margin: 0 0 1.2rem;
      border: 1px solid rgba(196,155,88,.2);
    }
    .prose pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      font-size: .86rem;
      line-height: 1.55;
    }
    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 1.3rem;
      font-size: .94rem;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .prose th, .prose td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .prose th {
      background: rgba(17,38,59,.06);
      color: var(--navy);
      font-size: .78rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .prose tr:last-child td { border-bottom: 0; }
    .prose input[type="checkbox"] {
      margin-right: 8px;
      accent-color: var(--gold);
    }

    .state {
      width: min(100%, var(--prose));
      padding: 48px 28px;
      color: var(--muted);
    }
    .state.error { color: #8a3b2f; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .toc {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 220px;
      }
      .prose { margin: 0 auto; }
      .article-wrap { padding: 20px 14px 60px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="./index.html">MALAÏKA <em>Freight</em></a>
    <div class="top-actions">
      <a class="btn" href="./index.html">← Portail</a>
      <a class="btn" id="rawLink" href="#" target="_blank" rel="noopener">Fichier source</a>
      <button class="btn gold" type="button" id="printBtn">Imprimer</button>
    </div>
  </header>

  <div class="layout">
    <aside class="toc">
      <div class="doc-select">
        <label for="docSwitch">Document</label>
        <select id="docSwitch"></select>
      </div>
      <h2>Sommaire</h2>
      <div id="tocList"></div>
    </aside>

    <div class="article-wrap">
      <div class="meta">
        <span class="pill" id="docPill">Documentation</span>
        <span class="file" id="docPath"></span>
      </div>
      <div id="state" class="state">Chargement…</div>
      <article id="content" class="prose" hidden></article>
    </div>
  </div>

  <script>
    const DOCS = [
      { path: "../DOCUMENTATION-MALAIKA-FREIGHT.md", label: "Documentation complète", tag: "Produit" },
      { path: "../PLAN-DETAILLE.md", label: "Plan détaillé", tag: "Pilotage" },
      { path: "../PLAN-ETAPES.md", label: "Plan étape par étape", tag: "Exécution" },
      { path: "../ARCHITECTURE.md", label: "Architecture", tag: "Technique" },
      { path: "../STRUCTURE-ARBORESCENCE.md", label: "Structure & arborescence", tag: "Code" },
      { path: "../README.md", label: "Index docs", tag: "Index" },
      { path: "../_extracted/Malaika_Freight/CAHIER_DES_CHARGES.md", label: "Cahier des charges", tag: "Client" }
    ];

    const params = new URLSearchParams(location.search);
    const requested = params.get("doc") || DOCS[0].path;
    const normalized = requested.replace(/^\.\//, "");

    function resolveDoc(input) {
      const clean = decodeURIComponent(input).replace(/\\/g, "/");
      const hit = DOCS.find((d) =>
        d.path.endsWith(clean) ||
        clean.endsWith(d.path.replace("../", "")) ||
        d.path === clean ||
        d.path === "../" + clean ||
        d.path === clean.replace(/^\//, "")
      );
      return hit || DOCS.find((d) => clean.includes(d.path.split("/").pop())) || DOCS[0];
    }

    const current = resolveDoc(normalized);
    const select = document.getElementById("docSwitch");
    const content = document.getElementById("content");
    const state = document.getElementById("state");
    const tocList = document.getElementById("tocList");
    const rawLink = document.getElementById("rawLink");

    DOCS.forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.path;
      opt.textContent = d.label;
      if (d.path === current.path) opt.selected = true;
      select.appendChild(opt);
    });

    select.addEventListener("change", () => {
      location.href = "./reader.html?doc=" + encodeURIComponent(select.value);
    });

    document.getElementById("docPill").textContent = current.tag;
    document.getElementById("docPath").textContent = current.path.replace("../", "docs/");
    rawLink.href = current.path;
    document.title = current.label + " — Malaïka Freight";
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    marked.setOptions({
      gfm: true,
      breaks: false
    });

    const renderer = new marked.Renderer();
    const slugCount = {};
    function slugify(text) {
      const base = String(text)
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-");
      slugCount[base] = (slugCount[base] || 0) + 1;
      return slugCount[base] > 1 ? base + "-" + slugCount[base] : base;
    }

    renderer.heading = function ({ text, depth }) {
      const plain = text.replace(/<[^>]+>/g, "");
      const id = slugify(plain);
      return `<h${depth} id="${id}">${text}</h${depth}>`;
    };

    renderer.link = function ({ href, title, text }) {
      const titleAttr = title ? ` title="${title}"` : "";
      if (href && href.endsWith(".md")) {
        const readerHref = "./reader.html?doc=" + encodeURIComponent(href.startsWith("../") || href.startsWith("./") ? href : "../" + href);
        return `<a href="${readerHref}"${titleAttr}>${text}</a>`;
      }
      if (href && href.startsWith("http")) {
        return `<a href="${href}"${titleAttr} target="_blank" rel="noopener">${text}</a>`;
      }
      return `<a href="${href || "#"}"${titleAttr}>${text}</a>`;
    };

    async function load() {
      try {
        const res = await fetch(current.path);
        if (!res.ok) throw new Error("Impossible de charger " + current.path);
        const md = await res.text();
        content.innerHTML = marked.parse(md, { renderer });
        content.hidden = false;
        state.hidden = true;
        buildToc();
      } catch (err) {
        state.classList.add("error");
        state.innerHTML = `<strong>Lecture impossible.</strong><br>${err.message}<br><br>Ouvre le portail via un serveur local (Laragon / php -S), pas en double-clic file://.`;
      }
    }

    function buildToc() {
      tocList.innerHTML = "";
      const heads = content.querySelectorAll("h1, h2, h3");
      heads.forEach((h) => {
        if (!h.id) return;
        const a = document.createElement("a");
        a.href = "#" + h.id;
        a.textContent = h.textContent;
        a.className = h.tagName === "H1" ? "l1" : h.tagName === "H2" ? "l2" : "l3";
        tocList.appendChild(a);
      });

      const links = [...tocList.querySelectorAll("a")];
      const spy = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          links.forEach((l) => l.classList.toggle("active", l.getAttribute("href") === "#" + e.target.id));
        });
      }, { rootMargin: "-20% 0px -70% 0px" });
      heads.forEach((h) => spy.observe(h));
    }

    load();
  </script>
</body>
</html>
